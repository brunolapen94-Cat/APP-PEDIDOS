const MATS = DATA.mats, ALMS = DATA.alms;
const MAT_BY_ID = new Map(MATS.map(m=>[m.id,m]));
const ALM_BY_KEY = new Map(ALMS.map(a=>[a.key,a]));
const ALM_BY_CODE = new Map(ALMS.map(a=>[a.almacen||a.alm,a]));
let STOCK = {}, stockActualizado = '', pedido = {}, selTec = null, selAlm = null, almStock = {}, favTab = 'service', ultimoMailto = '', ultimoCuerpo = '';
function normalizar(v){return String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function escHtml(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fecha(){return new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}
function almCode(){return selAlm ? (selAlm.almacen || selAlm.alm || String(selAlm.key||'').split('-').pop()) : ''}
function patenteFromAlm(){if(selTec&&selTec.patente)return selTec.patente;const label=selAlm?.label||'';if(label.includes(' - '))return label.split(' - ').pop().trim();if(label.includes('—'))return label.split('—').pop().trim();return ''}
function almPat(){const a=almCode();const p=patenteFromAlm();return a ? a+(p?' - '+p:'') : 'No informado'}
function tecnicoNombre(){return selTec?.nombre || document.getElementById('inp-tec').value.trim() || 'No informado'}
function legajo(){return selTec?.legajo || 'No informado'}
async function cargarStock(){try{const r=await fetch('stock.json?v='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();STOCK=j.stock||{};stockActualizado=j.actualizado||''}}catch(e){}pintarStockFecha()}
function pintarStockFecha(){document.getElementById('stock-date').textContent=stockActualizado?'Stock actualizado: '+stockActualizado:''}
ALMS.forEach(a=>{const o=document.createElement('option');o.value=a.key;o.textContent=a.label||((a.almacen||a.alm)+' - '+(a.patente||''));document.getElementById('inp-alm').appendChild(o)})
function buscarTecnico(v){const q=normalizar(v);selTec=null;if(q.length<2){document.getElementById('tec-suggest').classList.remove('vis');actualizarDatos();return}const res=TECNICOS.filter(t=>normalizar(t.nombre).includes(q)||String(t.legajo).includes(q)||normalizar(t.almacen).includes(q)).slice(0,8);const box=document.getElementById('tec-suggest');box._res=res;box.innerHTML=res.map((t,i)=>'<div class="sg" onclick="seleccionarTecnico('+i+')"><div class="sg-title">'+escHtml(t.nombre)+'</div><div class="sg-sub">Legajo '+t.legajo+' · Almacén '+t.almacen+' · Patente '+t.patente+'</div></div>').join('');box.classList.toggle('vis',res.length>0);const exact=res.find(t=>String(t.legajo)===v.trim());if(exact)aplicarTecnico(exact,false);actualizarDatos()}
function seleccionarTecnico(i){const t=document.getElementById('tec-suggest')._res?.[i];if(t)aplicarTecnico(t,true)}
function aplicarTecnico(t,cerrar){selTec=t;document.getElementById('inp-tec').value=t.nombre+' - '+t.legajo;const a=ALM_BY_CODE.get(t.almacen)||ALMS.find(x=>String(x.key).endsWith('-'+t.almacen));if(a)document.getElementById('inp-alm').value=a.key;if(cerrar)document.getElementById('tec-suggest').classList.remove('vis');actualizarDatos()}
function tecnicoPorAlmacen(){const a=almCode();return a?TECNICOS.find(t=>String(t.almacen).trim()===a):null}
function completarTecnicoPorAlmacen(){if(selTec)return;const t=tecnicoPorAlmacen();if(!t)return;selTec=t;document.getElementById('inp-tec').value=t.nombre+' - '+t.legajo}
function almacenManual(){selAlm=ALM_BY_KEY.get(document.getElementById('inp-alm').value)||null;selTec=null;completarTecnicoPorAlmacen();actualizarDatos()}
function actualizarDatos(){selAlm=ALM_BY_KEY.get(document.getElementById('inp-alm').value)||null;completarTecnicoPorAlmacen();document.getElementById('i-tec').textContent=tecnicoNombre();document.getElementById('i-leg').textContent=legajo();document.getElementById('i-alm').textContent=almCode()||'-';document.getElementById('i-pat').textContent=patenteFromAlm()||'-';document.getElementById('btn1').disabled=!selAlm}
function stockMap(){const k=selAlm?.key, a=almCode();return STOCK[k]||STOCK[a]||{}}
function stockQty(id){const v=almStock[id];if(v==null)return 0;if(typeof v==='object')return Number(v.cantidad||0);return Number(v)||0}
function stockText(id){const q=stockQty(id);return q>0?'Stock: '+Math.round(q)+' '+unit(id):'Sin stock'}
function stockCls(id){return stockQty(id)>0?'ok':'no'}
function unit(id){return (MAT_BY_ID.get(id)?.u||'UN').toUpperCase()}
function step(id){const n=Number(MAT_BY_ID.get(id)?.r||1);return n>0?n:1}
function goSearch(){selAlm=ALM_BY_KEY.get(document.getElementById('inp-alm').value);if(!selAlm)return;almStock=stockMap();pedido={};document.getElementById('top-sub').textContent=almPat();goScreen(2);renderList('');setTimeout(()=>document.getElementById('inp-q').focus(),100)}
function goScreen(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('sc'+n).classList.add('active');const paso=n>=3?3:n;document.getElementById('step-label').textContent=paso+' de 3';document.getElementById('bar-fill').style.width=(paso===1?33:paso===2?66:100)+'%';document.getElementById('top-title').textContent=n===4?'Pedido preparado':'Pedido de Materiales';document.getElementById('cart').classList.toggle('vis',n===2&&Object.keys(pedido).length>0);window.scrollTo(0,0);if(n===3)resumen()}
function doSearch(v){document.getElementById('btn-clear').classList.toggle('vis',v.length>0);renderList(normalizar(v))}
function clearSearch(){document.getElementById('inp-q').value='';document.getElementById('btn-clear').classList.remove('vis');renderList('')}
function setFavTab(t){favTab=t;document.getElementById('tab-service').classList.toggle('on',t==='service');document.getElementById('tab-redes').classList.toggle('on',t==='redes');renderFav()}
function addMat(id){pedido[id]=(pedido[id]||0)+step(id);renderList(normalizar(document.getElementById('inp-q').value));cart()}
function chg(id,d,e){e&&e.stopPropagation();const next=(pedido[id]||0)+d*step(id);if(next<=0)delete pedido[id];else pedido[id]=next;renderList(normalizar(document.getElementById('inp-q').value));cart()}
function card(m){const q=pedido[m.id]||0;return '<div class="card '+(q?'selected':'')+'"><div><div class="mat-name">'+escHtml(m.n)+'</div><div class="mat-id">'+m.id+'</div>'+(q&&m.d?'<div class="mat-desc">'+escHtml(m.d)+'</div>':'')+'</div><div class="right"><span class="pill '+stockCls(m.id)+'">'+stockText(m.id)+'</span><button class="add" onclick="addMat(&quot;'+m.id+'&quot;)">+</button></div>'+(q?'<div class="qty"><span class="qty-label">Pedido</span><div class="qty-ctrl"><button class="qbtn" onclick="chg(&quot;'+m.id+'&quot;,-1,event)">-</button><span class="qnum">'+q+' '+unit(m.id)+'</span><button class="qbtn" onclick="chg(&quot;'+m.id+'&quot;,1,event)">+</button></div></div>':'')+'</div>'}
function renderFav(){const panel=document.getElementById('fav-panel'),list=document.getElementById('fav-list'),q=normalizar(document.getElementById('inp-q').value);panel.style.display=q.length>=2?'none':'block';if(q.length>=2)return;list.innerHTML=(FRECUENTES[favTab]||[]).map(id=>MAT_BY_ID.get(id)).filter(Boolean).map(card).join('')||'<div class="empty">Sin frecuentes cargados</div>'}
function renderList(q){renderFav();const list=document.getElementById('mat-list'),hint=document.getElementById('hint-txt');if(q.length<2){hint.textContent='Catálogos frecuentes';const selected=Object.keys(pedido).map(id=>MAT_BY_ID.get(id)).filter(Boolean);list.innerHTML=selected.length?'<div class="section-head">Pedido actual</div>'+selected.map(card).join(''):'';return}const res=MATS.filter(m=>normalizar(m.n).includes(q)||normalizar(m.d).includes(q)||m.id.includes(q)).slice(0,50);hint.textContent='Resultados: '+res.length;list.innerHTML=res.length?res.map(card).join(''):'<div class="empty">Sin resultados</div>'}
function cart(){const n=Object.keys(pedido).length;document.getElementById('cart-n').textContent=n;document.getElementById('cart').classList.toggle('vis',document.getElementById('sc2').classList.contains('active')&&n>0)}
function goResumen(){goScreen(3)}
function resumen(){document.getElementById('r-tec').textContent=tecnicoNombre();document.getElementById('r-leg').textContent=legajo();document.getElementById('r-alm').textContent=almPat();document.getElementById('r-fecha').textContent=fecha();document.getElementById('r-items').innerHTML=Object.entries(pedido).map(([id,q])=>{const m=MAT_BY_ID.get(id)||{n:id};return '<div class="item"><span>'+id+'</span><span>'+escHtml(m.n)+'</span><span class="qtytxt">'+q+' '+unit(id)+'</span></div>'}).join('')}
function cuerpoMail(){const lineas=Object.entries(pedido).map(([id,q])=>{const m=MAT_BY_ID.get(id)||{n:id,d:''};return '['+id+'] '+m.n+(m.d?'\n'+m.d:'')+'\nCantidad: '+q+' '+unit(id)}).join('\n\n');const notas=document.getElementById('inp-notas').value.trim();return 'PEDIDO DE MATERIALES\n\nTécnico: '+tecnicoNombre()+'\nLegajo: '+legajo()+'\nAlmacén: '+almPat()+'\nFecha: '+fecha()+'\n\nMATERIALES:\n'+lineas+(notas?'\n\nObservaciones: '+notas:'')}
function enviar(){ultimoCuerpo=cuerpoMail();ultimoMailto='mailto:'+MAIL+'?subject='+encodeURIComponent('Pedido de materiales - '+almPat())+'&body='+encodeURIComponent(ultimoCuerpo);document.getElementById('mail-prev').textContent=ultimoCuerpo;goScreen(4);abrirMail()}
function abrirMail(){if(!ultimoMailto)return;if(ultimoMailto.length>1800){alert('El pedido es largo. Usá Copiar y pegalo en Outlook.');return}location.href=ultimoMailto}
async function copiarPedido(){if(!ultimoCuerpo)ultimoCuerpo=cuerpoMail();try{await navigator.clipboard.writeText(ultimoCuerpo);alert('Pedido copiado.')}catch(e){document.getElementById('mail-prev').textContent=ultimoCuerpo}}
function reset(){pedido={};selTec=null;selAlm=null;document.getElementById('inp-tec').value='';document.getElementById('inp-alm').value='';document.getElementById('inp-q').value='';document.getElementById('inp-notas').value='';document.getElementById('top-sub').textContent='sistema activo';actualizarDatos();goScreen(1)}
cargarStock();actualizarDatos();
</script>
